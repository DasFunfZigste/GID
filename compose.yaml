name: gid

services:
  gid:
    build: .
    restart: unless-stopped
    init: true
    environment:
      GID_DATA_DIR: /data
      GID_COOKIE_SECURE: ${GID_COOKIE_SECURE:-false}
      GID_TIMEZONE: ${GID_TIMEZONE:-America/New_York}
    ports:
      - "${GID_BIND_IP:-0.0.0.0}:${GID_PORT:-8001}:8000"
    volumes:
      - gid-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  gid-data:
